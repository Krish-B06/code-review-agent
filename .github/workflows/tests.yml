name: Run Tests and Review

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  code_review:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch base branch for diff review
        run: git fetch origin main --depth=1

      - name: Run code review agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os

          from app.agent.review_orchestrator import ReviewOrchestrator

          provider_name = "openai" if os.getenv("OPENAI_API_KEY") else "mock"
          review = ReviewOrchestrator(provider_name=provider_name).review()

          print(json.dumps({
              "summary": review.get("summary"),
              "suggested_fixes": review.get("suggested_fixes", []),
              "validation_status": review.get("validation_status"),
          }, indent=2))

          with open("review_comment.md", "w", encoding="utf-8") as fh:
              fh.write(review.get("comment", ""))
          PY

      - name: Comment PR with review result
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "Missing GITHUB_TOKEN; skipping PR comment."
            exit 0
          fi

          if [ ! -f review_comment.md ]; then
            echo "No review comment file generated; skipping PR comment."
            exit 0
          fi

          python - <<'PY'
          import os
          import requests

          with open("review_comment.md", "r", encoding="utf-8") as fh:
              body = fh.read()

          repo = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ["GITHUB_REF"]
          pr_number = ref.split("/")[-2]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              },
              json={"body": body},
          )
          response.raise_for_status()
          PY